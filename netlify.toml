[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions (guestbook -> Notion). Reachable at /.netlify/functions/<name>
[functions]
  directory = "netlify/functions"

# Long cache for fonts (filenames are stable, content never changes)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
